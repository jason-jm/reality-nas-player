[versions]
agp = "8.13.2"
kotlin = "2.2.21"
coreKtx = "1.13.0"
bom = "6.2.8"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
annotation = "1.7.0"
appcompat = "1.6.1"
# The version the PICO SDK already brings in; declared for the permission request (SourcesScreen).
activityCompose = "1.10.1"
koin = "3.5.6"
smbj = "0.12.2"
dcerpc = "0.12.13"
media3 = "1.8.0"
coroutines = "1.9.0"
anitomyj = "0.0.7"
orgjson = "20240303"
commonsNet = "3.11.1"
jsch = "0.2.20"
commonsCompress = "1.27.1"
xz = "1.10"
ftpserver = "1.2.0"
sshd = "2.12.1"
nfs4j = "0.28.5"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
bom = { group = "com.pico.spatial", name = "bom", version.ref = "bom" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
core = { group = "com.pico.spatial.core", name = "core" }
platform = { group = "com.pico.spatial.ui", name = "platform" }
foundation = { group = "com.pico.spatial.ui", name = "foundation" }
design = { group = "com.pico.spatial.ui", name = "design" }
sense = { group = "com.pico.spatial.sense", name = "sense" }
tracking = { group = "com.pico.spatial.tracking", name = "tracking" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
smbj = { group = "com.hierynomus", name = "smbj", version.ref = "smbj" }
dcerpc = { group = "com.rapid7.client", name = "dcerpc", version.ref = "dcerpc" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
media3-exoplayer-dash = { group = "androidx.media3", name = "media3-exoplayer-dash", version.ref = "media3" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
anitomyj = { group = "com.dgtlrepublic", name = "anitomyJ", version.ref = "anitomyj" }
orgjson = { group = "org.json", name = "json", version.ref = "orgjson" }
commons-net = { group = "commons-net", name = "commons-net", version.ref = "commonsNet" }
jsch = { group = "com.github.mwiede", name = "jsch", version.ref = "jsch" }
commons-compress = { group = "org.apache.commons", name = "commons-compress", version.ref = "commonsCompress" }
xz = { group = "org.tukaani", name = "xz", version.ref = "xz" }
ftpserver-core = { group = "org.apache.ftpserver", name = "ftpserver-core", version.ref = "ftpserver" }
sshd-sftp = { group = "org.apache.sshd", name = "sshd-sftp", version.ref = "sshd" }
nfs4j-core = { group = "org.dcache", name = "nfs4j-core", version.ref = "nfs4j" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
